[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdct-shared-schema"
version = "1.0.0"
description = "Shared session_metadata.json / trials.csv / timestamp-sidecar contract between the acquisition and analysis apps."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["schema"]
