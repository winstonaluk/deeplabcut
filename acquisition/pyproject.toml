[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdct-acquisition"
version = "0.1.0"
description = "Multi-camera behavioral video acquisition GUI for PDCT."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["app", "gui", "acquisition", "paradigms", "storage", "pose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests are deselected by default so the suite passes with nothing
# plugged in (invariant 2). Run them at the rig with `pytest -m hardware`.
addopts = ["-m", "not hardware"]
markers = [
    "hardware: needs the real camera attached; deselected by default",
    "requires_ffmpeg: spawns a real FFmpeg process; skipped when ffmpeg is absent",
]
