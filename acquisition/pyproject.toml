[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdct-acquisition"
version = "0.1.0"
description = "Multi-camera behavioral video acquisition GUI for PDCT."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["app", "gui", "acquisition", "paradigms", "storage", "pose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
