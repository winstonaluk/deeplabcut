# Acquisition app configuration. Every threshold, path, keybinding, and
# encoder setting the app uses reaches code through this file -- see
# acquisition/CLAUDE.md "Conventions". Nothing here is a literal in code.

[app]
version = "0.1.0"
rig_id = "rig-1"

[[cameras]]
# N-camera by construction (invariant 1). One entry today; add more [[cameras]]
# tables to add views. `name` is a human label (e.g. "lateral"), not the
# Spinnaker serial.
serial = "22514545"  # Blackfly S BFS-U3-04S2C; see acquisition/HARDWARE.md
name = "lateral"
# The symbolic name ("UserSet1") or the name SpinView displays ("User Set 1").
user_set = "UserSet1"

[capture]
fps = 30
# The ROI saved in UserSet1 (2026-09-10), inside the BFS-U3-04S2C's 720x540
# full sensor (Sony IMX287, 0.4 MP -- NOT 1280x720; the "720p" in the old
# hardware notes was a misread of "720x540"). Preflight blocks the session if
# these disagree with what the camera reports; see
# acquisition/acquisition/HARDWARE.md.
width = 680
height = 460
# Blocking tolerance, in fps, on the camera's reported rate vs `fps` above.
fps_tolerance = 0.5
queue_maxsize = 120
preview_fps = 15
preroll_buffer_s = 2.0
# Transport-layer stream buffers. Not covered by user sets, so the app owns
# them. 64 buffers is ~2 s of slack at 30 fps against a writer hiccup; the
# camera ships with 10 (~0.33 s).
stream_buffer_count = 64
# mono8 or bgr8. Mono8 is the default: DLC gains nothing from colour here,
# it is a third of the bytes, and debayering costs host CPU on a machine
# with no usable GPU. Note the sensor IS colour, so Mono8 is derived luma.
pixel_format = "mono8"

[encoder]
codec = "h264_qsv"
fallback_codec = "libx264"

# Quality is per-codec because the two scales are NOT interchangeable. libx264
# takes -crf; h264_qsv takes -global_quality, whose numbers mean something
# different for the same visual result. One shared value silently produced two
# different qualities depending on which encoder resolved.
#
# Lower = better quality and bigger files, on both scales. These are starting
# points, not measurements -- run tools/measure_encoder.py against real footage
# and set them from the results. See "Encoder tuning" in CLAUDE.md.
crf = 20
qsv_global_quality = 22

# Compression effort. Slower presets mean smaller files at the same quality,
# paid for in CPU. At 720x540/30fps the frames are small, so there is real
# headroom here -- but the writer must sustain throughput without dropping
# frames, so verify before raising it.
preset = "slow"
qsv_preset = "slower"

# Seconds between keyframes. DLC decodes sequentially, so long GOPs are cheap
# for us and save meaningful space. Shorten only if you need to scrub.
keyframe_interval_s = 4

# yuv420p rather than gray: the chroma planes are constant on Mono8 input, so
# H.264 compresses them to almost nothing, and it keeps the files readable by
# every downstream tool. Monochrome H.264 (gray) saves little and is handled
# inconsistently by decoders -- not worth the interop risk for DLC input.
pixel_format = "yuv420p"

[camera_verify]
# Camera settings read back after UserSetLoad and compared as strings. Any
# mismatch is its own named preflight failure and blocks the session.
#
# This is verification, never configuration (invariant 7): these values are
# set in SpinView and saved to the user set. The app refuses to record when
# they are wrong; it does not fix them.
#
# Why each one matters:
#   ExposureAuto/GainAuto  auto-tuning tracks the animal's position down the
#                          pole, so appearance covaries with the very thing
#                          DLC is being trained to locate.
#   GammaEnable            a nonlinearity between sensor and training data.
#   AcquisitionFrameRate*  unlatched rate means video duration is wrong, and
#                          duration is the primary dependent variable.
#   SensorShutterMode      rolling shutter skews a descending animal.
#   PixelFormat            must agree with capture.pixel_format above.
ExposureAuto = "Off"
GainAuto = "Off"
GammaEnable = "False"
AcquisitionFrameRateEnable = "True"
SensorShutterMode = "Global"
TriggerMode = "Off"
PixelFormat = "Mono8"

[paradigm]
active = "pdct"

[trial_timing]
# See acquisition/CLAUDE.md "Trial state machine". All in seconds.
min_trial_duration_s = 5
suspicious_duration_s = 30
max_trial_duration_s = 600

[keymap]
# key -> reason_code. New paradigms define different codes here without
# source changes.
F = "fall"
Z = "freeze"
D = "did_not_descend"
E = "experimenter_error"
V = "other_invalid"

[reason_code_labels]
fall = "Fell from the pole"
freeze = "Froze partway down"
did_not_descend = "Never initiated descent"
experimenter_error = "Handling/placement error"
other_invalid = "Generic; reason assigned later"

[metadata]
projects = ["pdct-pilot"]
experimenter_initials = ["WL"]
animal_id_regex = "^[A-Za-z0-9_-]+$"

[storage]
session_root = "./sessions"
min_free_gb = 20
# Optional <view> filename token; default off. Enable when more cameras are
# added -- DLC flattens folder structure on import so filenames must stand
# alone (see acquisition/CLAUDE.md "Files and naming").
filename_include_view_token = false

[staging]
# Generic mounted path / rsync / robocopy target -- never institution-specific.
target_path = ""
checksum_algorithm = "sha256"

[logging]
level = "INFO"
